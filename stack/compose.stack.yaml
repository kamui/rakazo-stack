# rakazo-stack's layer over Rakazo's own compose file, which is used unmodified.
# Written by `rakazo-stack setup` on every run; edits are overwritten.
services:
  api:
    # The web app proxies /api and /rpc, so the API port stays unpublished (spec §5).
    ports: !reset []
    networks:
      - stack
  worker:
    networks:
      - stack

  lemonade:
    image: ${LEMONADE_IMAGE:-not-recorded}
    profiles: [lemonade]
    restart: unless-stopped
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?}
    volumes:
      - lemonade-models:/opt/lemonade/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-data:/opt/lemonade/.cache/lemonade
      - lemonade-config:/opt/lemonade/.config/lemonade
    networks:
      - stack
      - egress
    # The image's own check runs every 30 s, which would hold `up --wait` that long.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:13305/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 2s

  lemonade-relay:
    build: ./relay
    restart: unless-stopped
    environment:
      UPSTREAM: ${LEMONADE_UPSTREAM:-http://lemonade:13305}
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?}
    networks:
      - stack
      - egress

  supervisor:
    # The supervisor probes the egress rules when it starts (spec §12).
    depends_on:
      computer-egress:
        condition: service_started

  computer-egress:
    build: ./computer-egress
    network_mode: host
    cap_add: [NET_ADMIN]
    restart: unless-stopped

  # Memory (spec §10). The values come from .env, which has them only while memory is on.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight-api:${HINDSIGHT_IMAGE_TAG:-not-recorded}
    profiles: [hindsight]
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      hindsight-db:
        condition: service_healthy
    networks: [stack, hindsight-data, egress]
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:-}@hindsight-db:5432/hindsight
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY:
      HINDSIGHT_API_LLM_PROVIDER:
      HINDSIGHT_API_LLM_API_KEY:
      HINDSIGHT_API_LLM_MODEL:
      # OpenRouter only; left unset otherwise.
      HINDSIGHT_API_LLM_REASONING_EFFORT:
      HINDSIGHT_API_LLM_EXTRA_BODY:
      # Pinned, so an upstream default change can't break boot.
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-small-en-v1.5
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: hindsight-ai/hs-rerank-1
      # Keeps two recalls at once under Rakazo's 15 s recall timeout on a slow CPU (#47).
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "100"
      # Stable, so in-flight tasks survive a restart.
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_MCP_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s

  hindsight-db:
    image: pgvector/pgvector:${HINDSIGHT_DB_IMAGE_TAG:-not-recorded}
    profiles: [hindsight]
    restart: unless-stopped
    # Each new bank builds its HNSW indexes in parallel once memory_units passes 8 MB,
    # which overflows Docker's 64 MB default (#48).
    shm_size: 1g
    networks: [hindsight-data]
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_DB: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-}
    volumes:
      - hindsight-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hindsight", "-d", "hindsight"]
      interval: 5s
      timeout: 5s
      retries: 12

  tailscale:
    profiles: [tailscale]
    # `.env` holds the recorded version and digest whenever the profile is on.
    image: tailscale/tailscale:${TAILSCALE_IMAGE_TAG:-not-recorded}
    restart: unless-stopped
    environment:
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TS_HOSTNAME:-rakazo}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_SERVE_CONFIG: /config/serve.json
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks: [app]

networks:
  stack:
    internal: true
  # Keeps Hindsight's database off `stack`.
  hindsight-data:
    internal: true
  egress: {}

configs:
  tailscale-serve:
    # `$$` leaves ${TS_CERT_DOMAIN} for Tailscale to fill in.
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://web:5173" } } } }
      }

volumes:
  hindsight-pgdata:
  tailscale-state:
  lemonade-models:
  lemonade-llama:
  lemonade-data:
  lemonade-config:
