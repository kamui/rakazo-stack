name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: shellcheck install.sh scripts/*.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The ignored tests need Docker: they run `setup` against real Rakazo images and
  # tear the test Instance down.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: df -h /
      - run: cargo test --locked -- --ignored
      # Pulled images outlive the test Instance; its volumes, voice models included, don't.
      - if: always()
        run: df -h / && docker system df

  # Both executables with their gates, and an install.sh run against them.
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: v0.0.0-ci

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # The tests generate their audio with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - working-directory: relay
        run: bun test
      - run: relay/test/image.sh
