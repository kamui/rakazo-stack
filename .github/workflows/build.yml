name: Build

# Both CI and Release call this, so a release is built and gated exactly as a PR is.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to bake into install.sh
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.16.0
  CARGO_ZIGBUILD_VERSION: v0.24.1

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-zigbuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/cargo-zigbuild"
          mkdir -p "$dir"
          cd "$dir"
          asset=cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$CARGO_ZIGBUILD_VERSION" -R rust-cross/cargo-zigbuild -p "$asset" -p "$asset.sha256"
          sha256sum -c "$asset.sha256" 2>/dev/null | grep -q ': OK$'
          tar -xJf "$asset"
          dirname "$(find "$dir" -type f -name cargo-zigbuild)" >> "$GITHUB_PATH"
      # spec §18: the Linux executable must run on glibc 2.17.
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.17
      - name: Check the newest glibc symbol is at most 2.17
        run: |
          bin=target/x86_64-unknown-linux-gnu/release/rakazo-stack
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\n2.17\n' "$newest" | sort -V | tail -1)" = "2.17" ]
      - run: target/x86_64-unknown-linux-gnu/release/rakazo-stack --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rakazo-stack-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/rakazo-stack
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo build --release --locked --target aarch64-apple-darwin
      # spec §18: Apple silicon kills an executable with an invalid signature.
      - run: codesign --verify --strict target/aarch64-apple-darwin/release/rakazo-stack
      - run: target/aarch64-apple-darwin/release/rakazo-stack --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rakazo-stack-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/rakazo-stack
          if-no-files-found: error

  # The three files a release holds, as the `release` artifact.
  package:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rakazo-stack-*
          path: artifacts
      - name: Name the executables and bake install.sh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            mv "artifacts/rakazo-stack-$target/rakazo-stack" "release/rakazo-stack-$target"
          done
          scripts/bake-install.sh "$TAG" release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  # The baked install.sh installs the real executables, from a folder standing in for
  # the release, before anything is published.
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release
          path: release
      - name: Install with the baked install.sh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/downloads/$TAG" "$RUNNER_TEMP/home"
          cp release/* "$RUNNER_TEMP/downloads/$TAG/"
          export RAKAZO_STACK_TEST_DOWNLOAD_BASE="file://$RUNNER_TEMP/downloads"
          HOME="$RUNNER_TEMP/home" sh -s -- --no-setup < release/install.sh
          "$RUNNER_TEMP/home/.local/bin/rakazo-stack" --version
      - name: Install from a shell running under Rosetta
        if: runner.os == 'macOS'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ "$(arch -x86_64 /bin/sh -c 'uname -m')" = x86_64 ]
          mkdir -p "$RUNNER_TEMP/rosetta-home"
          export RAKAZO_STACK_TEST_DOWNLOAD_BASE="file://$RUNNER_TEMP/downloads"
          HOME="$RUNNER_TEMP/rosetta-home" arch -x86_64 /bin/sh -s -- --no-setup < release/install.sh
          "$RUNNER_TEMP/rosetta-home/.local/bin/rakazo-stack" --version
