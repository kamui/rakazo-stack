# PROTOTYPE, throwaway: rakazo-stack's layer over Rakazo's unmodified v0.4.0 compose file.
# Used as: COMPOSE_FILE=rakazo.v0.4.0.images.yml:compose.stack.yaml (one compose project).
# Profiles (COMPOSE_PROFILES, written by setup): lemonade (Linux/Windows), memory, tailscale.

services:
  # Rakazo's other settings (RAKAZO_OPENAI_COMPAT_PRIVATE_HOSTS=voice-relay, MCP_ALLOW_PRIVATE_ENDPOINT=true)
  # come from .env, which upstream's file already passes through, so upstream's file stays unmodified.
  api:
    networks: [stack]
  worker:
    networks: [stack]

  lemonade:
    profiles: [lemonade]
    build:
      dockerfile_inline: |
        FROM ghcr.io/lemonade-sdk/lemonade-server:v2026.44.1
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
    image: rakazo-stack/lemonade:v2026.44.1-ffmpeg
    restart: unless-stopped
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?generated by setup}
    volumes:
      - lemonade-models:/opt/lemonade/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-data:/opt/lemonade/.cache/lemonade
      - lemonade-config:/opt/lemonade/.config/lemonade
    networks: [stack, egress]

  voice-relay:
    image: oven/bun:1.4.4-alpine
    restart: unless-stopped
    user: bun
    command: ["bun", "/relay/lang-code-relay.ts"]
    environment:
      UPSTREAM: ${LEMONADE_UPSTREAM:-http://lemonade:13305}
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?generated by setup}
      PORT: "13306"
    volumes:
      - ./relay:/relay:ro
    networks: [stack, egress]

  honcho:
    profiles: [memory]
    image: ghcr.io/plastic-labs/honcho:v3.5.0
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment: &honcho-env
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD:?generated by setup}@honcho-db:5432/honcho
      AUTH_USE_AUTH: "true"
      AUTH_JWT_SECRET: ${HONCHO_AUTH_JWT_SECRET:?generated by setup}
      CACHE_ENABLED: "false"
      LLM_OPENAI_API_KEY: ${MODEL_PROVIDER_API_KEY:?memory needs a model provider key}
      # Model and embedding slots: decided by "Hosted or local embeddings for Honcho?" and the model-provider fog.
    depends_on:
      honcho-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [stack, honcho-data, egress]

  honcho-deriver:
    profiles: [memory]
    image: ghcr.io/plastic-labs/honcho:v3.5.0
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment: *honcho-env
    depends_on:
      honcho:
        condition: service_healthy
    networks: [honcho-data, egress]

  honcho-db:
    profiles: [memory]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: ${HONCHO_DB_PASSWORD:?generated by setup}
      POSTGRES_DB: honcho
    volumes:
      - honcho-pgdata:/var/lib/postgresql/data
      - ./honcho/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [honcho-data]

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.104.5
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-rakazo}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-rakazo}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    networks: [app]

volumes:
  lemonade-models:
  lemonade-llama:
  lemonade-data:
  lemonade-config:
  honcho-pgdata:
  tailscale-state:

networks:
  # Bot computers get their own per-bot networks from Rakazo's supervisor and never join these.
  stack:
    internal: true
  honcho-data:
    internal: true
  # Internal networks can't reach the internet or, on macOS, the host's native Lemonade.
  egress:
