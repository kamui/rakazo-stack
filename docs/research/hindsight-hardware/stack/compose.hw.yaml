# Throwaway measurement layer over Rakazo's unmodified v0.16.0 compose file, for #46 (RAM and disk only).
# Same shape as #42's layer, with Hindsight in place of Honcho:
#   unmodified Lemonade image, relay, hindsight + hindsight-db (shm_size 1g), Tailscale userspace.
# On a Mac, Lemonade runs natively instead: leave its profile off and point the relay at it with
# HW_LEMONADE_UPSTREAM=http://host.docker.internal:<port>.
# Hindsight gets a dummy LLM key and no internet: idle RAM needs no model provider, and nothing is spent.
services:
  # No Docker socket: this host runs another Rakazo install. Bot computers are measured with a
  # probe container started the way the supervisor starts them (measure-ram.sh, stage 4).
  supervisor:
    volumes: !override
      - appdata:/data
    environment:
      DOCKER_SOCKET: /nonexistent/docker.sock
  api:
    networks: [app, data, stack]
  worker:
    networks: [app, data, stack]

  lemonade:
    profiles: [lemonade]
    image: ghcr.io/lemonade-sdk/lemonade-server:v2026.47.1@sha256:715fbf048ad52c352fbcef37e4645603828119b8d750fb8a4c386e909f10913f
    restart: unless-stopped
    environment:
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?}
    ports: ["127.0.0.1:${HW_LEMONADE_PORT}:13305"]
    volumes:
      - lemonade-models:/opt/lemonade/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-data:/opt/lemonade/.cache/lemonade
      - lemonade-config:/opt/lemonade/.config/lemonade
    networks: [stack, egress]

  lemonade-relay:
    image: oven/bun:1.4.4-alpine
    restart: unless-stopped
    user: bun
    command: ["bun", "/relay/lang-code-relay.ts"]
    environment:
      UPSTREAM: ${HW_LEMONADE_UPSTREAM:-http://lemonade:13305}
      LEMONADE_API_KEY: ${LEMONADE_API_KEY:?}
      PORT: "13306"
    configs:
      - source: relay
        target: /relay/lang-code-relay.ts
    networks: [stack, egress]

  hindsight:
    profiles: [hindsight]
    image: ghcr.io/vectorize-io/hindsight-api:1.3.0@sha256:c054765e9196fb1fe63497be06bcb55256c9024cc9314f951dc59858985ab242
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD:?}@hindsight-db:5432/hindsight
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_TENANT_API_KEY:?}
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_API_KEY: dummy-not-a-key
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_LLM_MODEL: "~z-ai/glm-flash-latest"
      HINDSIGHT_API_LLM_REASONING_EFFORT: low
      HINDSIGHT_API_LLM_EXTRA_BODY: '{"provider":{"zdr":true,"data_collection":"deny"}}'
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-small-en-v1.5
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: hindsight-ai/hs-rerank-1
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "100"
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_MCP_ENABLED: "false"
    depends_on:
      hindsight-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [stack, hindsight-data]

  hindsight-db:
    profiles: [hindsight]
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?}
      POSTGRES_DB: hindsight
    volumes:
      - hindsight-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hindsight-data]

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks: [app]

configs:
  relay:
    file: ./relay/lang-code-relay.ts

volumes:
  lemonade-models:
  lemonade-llama:
  lemonade-data:
  lemonade-config:
  hindsight-pgdata:
  tailscale-state:

networks:
  stack:
    internal: true
  hindsight-data:
    internal: true
  egress:
