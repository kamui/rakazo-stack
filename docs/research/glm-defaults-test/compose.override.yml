# Layered on Rakazo v0.4.0's infra/compose/docker-compose.images.yml for the throwaway GLM test.
# docker compose -p rs-glm-test --env-file .env -f docker-compose.images.yml -f compose.override.yml ...
x-hook: &hook
  NODE_OPTIONS: --import=/hook/hook.mjs
  OR_LOG_DIR: /orlog

services:
  # No Docker socket: this host also runs another Rakazo install, and the test needs no bot computers.
  supervisor:
    volumes: !override
      - appdata:/data
    environment:
      DOCKER_SOCKET: /nonexistent/docker.sock

  api:
    environment:
      <<: *hook
      HOOK_SVC: rakazo-api
    volumes:
      - ./hook:/hook:ro
      - ./orlog:/orlog

  worker:
    environment:
      <<: *hook
      HOOK_SVC: rakazo-worker
    volumes:
      - ./hook:/hook:ro
      - ./orlog:/orlog

  or-proxy:
    image: oven/bun:1.4.4-alpine
    restart: "no"
    command: ["bun", "/hook/proxy.mjs"]
    environment:
      OR_LOG_DIR: /orlog
    volumes:
      - ./hook:/hook:ro
      - ./orlog:/orlog
    networks:
      - honcho
      - egress

  honcho-db:
    image: pgvector/pgvector:pg15
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HONCHO_DB_PASSWORD:?}
    volumes:
      - honchodata:/var/lib/postgresql/data
    networks:
      - honcho
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  honcho-api:
    image: ghcr.io/plastic-labs/honcho:v3.5.0
    restart: "no"
    entrypoint: ["sh", "docker/entrypoint.sh"]
    env_file: honcho.env
    environment: &honcho-env
      DB_CONNECTION_URI: postgresql+psycopg://postgres:${HONCHO_DB_PASSWORD:?}@honcho-db:5432/postgres
      CACHE_ENABLED: "false"
      AUTH_USE_AUTH: "true"
      AUTH_JWT_SECRET: ${HONCHO_JWT_SECRET:?}
      LOG_LEVEL: INFO
      DREAM_DUE_POLL_INTERVAL_SECONDS: ${DREAM_POLL:-300}
      DREAM_DOCUMENT_THRESHOLD: ${DREAM_THRESHOLD:-50}
      DREAM_IDLE_TIMEOUT_MINUTES: ${DREAM_IDLE:-60}
      DERIVER_SCHEDULER: ${DERIVER_SCHEDULER:-deriver}
      DERIVER_BACKLOG_METRICS_POLL_INTERVAL_SECONDS: ${BACKLOG_POLL:-30}
    networks:
      - honcho
      - app
    depends_on:
      honcho-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
      interval: 5s
      timeout: 5s
      retries: 30

  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho:v3.5.0
    restart: "no"
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    env_file: honcho.env
    environment: *honcho-env
    networks:
      - honcho
      # Fetches tiktoken's o200k_base file on first start.
      - egress
    depends_on:
      honcho-api:
        condition: service_healthy

volumes:
  honchodata:

networks:
  honcho:
    internal: true
  egress: {}
