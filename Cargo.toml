[package]
name = "rakazo-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
age = { version = "0.12.1", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2.191"
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
