[package]
name = "rakazo-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
